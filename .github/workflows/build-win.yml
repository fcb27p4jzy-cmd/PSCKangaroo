name: Build PSCKangaroo for Windows (RTX 5090 / sm_120)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.1"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Patch project (sm_120 only, faster build)
        shell: pwsh
        run: |
          $p = 'PSCKangaroo.vcxproj'
          $x = Get-Content $p -Raw
          $x = $x -replace 'compute_89,sm_89;compute_86,sm_86;compute_75,sm_75;compute_61,sm_61;compute_120,sm_120', 'compute_120,sm_120'
          Set-Content $p $x -NoNewline
          Write-Host "Patched CodeGeneration -> compute_120,sm_120"

      - name: Build Release x64
        shell: pwsh
        run: |
          msbuild PSCKangaroo.sln -p:Configuration=Release -p:Platform=x64 -m -verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect exe + all runtime DLLs (zero-install package)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "x64\Release\PSCKangaroo.exe" dist\
          # CUDA runtime DLL (cudart64_128.dll etc.)
          Copy-Item "$env:CUDA_PATH\bin\cudart64_*.dll" dist\
          # MSVC CRT runtime DLLs (vcruntime140 / msvcp140), so no VC++ redist install needed
          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" | Select-Object -First 1
          foreach ($dll in @('vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll')) {
            $src = Join-Path $crt.FullName $dll
            if (Test-Path $src) { Copy-Item $src dist\ }
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Zip package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath PSCKangaroo-win-x64-sm120.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSCKangaroo-win-x64-sm120
          path: PSCKangaroo-win-x64-sm120.zip
          retention-days: 90

      - name: Create release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v61-win-sm120
          name: PSCKangaroo Windows x64 (RTX 5090 / sm_120)
          files: PSCKangaroo-win-x64-sm120.zip
